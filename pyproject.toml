[project]
name = "pii2pw"
version = "0.1.0"
description = "Turn personal information into a ranked weak-password wordlist — a rule-based targeted password guesser tuned for Chinese users"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pypinyin>=0.55.0",
    "pyyaml>=6.0",
    "rich>=14.2.0",
    "structlog>=25.5.0",
    "typer>=0.20.0",
]

[project.scripts]
pii2pw = "pii2pw.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ship the package together with its PEP 561 typing marker and data files.
packages = ["pii2pw"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.17",
    "types-pyyaml>=6.0",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["pii2pw"]

[[tool.mypy.overrides]]
# Optional PassLLM benchmark backend — these modules only exist when the user
# has cloned/installed PassLLM, so their imports cannot be resolved at lint time.
module = ["torch.*", "src.*", "inference.*"]
ignore_missing_imports = true

[tool.bumpversion]
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = false
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = false
message = "Bump version: {current_version} → {new_version}"
moveable_tags = []
commit_args = ""
setup_hooks = []
pre_commit_hooks = []
post_commit_hooks = []

[[tool.bump-my-version.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
